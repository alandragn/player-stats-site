<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA and NFL Player Stats</title>
    <!-- Link to your LOCAL css file -->
    <link rel="stylesheet" href="styles.css">
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>NBA and NFL Player Stats</h1>
    </header>

    <div id="player-stats">
        <h2>Player Stats</h2>
        <div id="player-list"></div>
    </div>

    <div id="player-details" style="display:none;">
        <h2 id="player-name"></h2>
        <canvas id="statsChart"></canvas>
        <h3>Defensive Stats</h3>
        <div id="defense-stats"></div>
        <h3>Prediction for Next Game</h3>
        <p id="prediction"></p>
        <button id="back-button" style="margin-top:20px;">Back to Player List</button>
    </div>

    <!-- Link to your LOCAL JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
