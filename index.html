<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NFL Player Stats Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>NFL Player Stats</h1>

        <input type="text" id="playerInput" placeholder="Enter player name... (e.g., Patrick Mahomes)">
        <button id="searchBtn">Search</button>

        <div id="playerInfo" class="hidden"></div>
        <div id="statsContainer" class="hidden">
            <h2>Game Stats</h2>
            <div id="statsList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
