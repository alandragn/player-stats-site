<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NFL Player Stats Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h1>NFL Player Stats</h1>

        <!-- SEARCH BAR (Always Visible) -->
        <div class="searchRow">
            <input 
                type="text" 
                id="playerInput" 
                placeholder="Enter player name (e.g., Patrick Mahomes)"
            >
            <button id="searchBtn">Search</button>
        </div>

        <!-- Player info -->
        <div id="playerInfo" class="hidden"></div>

        <!-- Stats -->
        <div id="statsContainer" class="hidden">
            <h2>Recent Game Stats</h2>
            <div id="statsList"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
