<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Player Stats</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js for player stats graph -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>NFL Player Stats</h1>

  <!-- Search form -->
  <form id="searchForm">
    <input type="text" id="searchInput" placeholder="Search players">
    <button type="submit">Search</button>
  </form>

  <!-- Container for all player cards -->
  <div id="resultsContainer"></div>

  <!-- Container for stats chart when a card is clicked -->
  <div id="statsContainer"></div>

  <!-- Frontend JS -->
  <script src="script.js"></script>
</body>
</html>
